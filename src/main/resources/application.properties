spring.application.name=project11

server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Relative to the working directory. Keep this directory when updating the JAR.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/project11;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.sql.init.mode=never

# Hibernate creates and updates tables from entity mappings, retaining existing data.
spring.jpa.hibernate.ddl-auto=update
# Load view data in a service transaction instead of during template rendering.
spring.jpa.open-in-view=false

# Reiseberichte: three to six JPEG/PNG attachments; normalized total is limited in the service.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=26MB

# SMTP delivery of attendance reminders and AaA decisions is opt-in; see doc/attendance-email.md.
app.attendance-mail.enabled=${ATTENDANCE_MAIL_ENABLED:false}
app.attendance-mail.from=${MAIL_FROM:}
app.attendance-mail.base-url=${PUBLIC_URL:}
# Password reset uses the same SMTP connection and public URL. It can be enabled
# independently; reset tokens are still created securely when delivery is disabled.
app.password-reset-mail.enabled=${PASSWORD_RESET_MAIL_ENABLED:${ATTENDANCE_MAIL_ENABLED:false}}
app.password-reset-mail.from=${MAIL_FROM:}
app.password-reset-mail.base-url=${PUBLIC_URL:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
