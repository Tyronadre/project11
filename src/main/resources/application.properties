spring.application.name=project11

server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Relative to the working directory. Keep this directory when updating the JAR.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/project11;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.sql.init.mode=never

# Hibernate creates and updates tables from entity mappings, retaining existing data.
spring.jpa.hibernate.ddl-auto=update
# Load view data in a service transaction instead of during template rendering.
spring.jpa.open-in-view=false
