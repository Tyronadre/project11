<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Neues Passwort · ZFG</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/navigation :: header}"></header>
    <main class="message-layout">
        <section class="form-card message-card" th:if="${!invalidToken}" aria-labelledby="reset-title">
            <span class="account-card-icon account-card-icon--key" aria-hidden="true">⌁</span>
            <span class="eyebrow">Fast geschafft</span>
            <h1 id="reset-title">Neues Passwort setzen.</h1>
            <p class="card-copy">Wähle mindestens 4 Zeichen. Der Link wird nach dem Speichern ungültig.</p>
            <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
                <input type="hidden" name="token" th:value="*{token}">
                <div class="field">
                    <label for="reset-new-password">Neues Passwort</label>
                    <input id="reset-new-password" name="newPassword" type="password" autocomplete="new-password"
                           minlength="4" maxlength="72" required th:attr="aria-invalid=${#fields.hasErrors('newPassword')}">
                    <p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
                    <p class="field-error" th:if="${#fields.hasErrors('passwordWithinByteLimit')}" th:errors="*{passwordWithinByteLimit}"></p>
                </div>
                <div class="field">
                    <label for="reset-confirm-password">Passwort wiederholen</label>
                    <input id="reset-confirm-password" name="confirmPassword" type="password" autocomplete="new-password"
                           maxlength="72" required th:attr="aria-invalid=${#fields.hasErrors('confirmPassword') or #fields.hasErrors('passwordsMatching')}">
                    <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                    <p class="field-error" th:if="${#fields.hasErrors('passwordsMatching')}" th:errors="*{passwordsMatching}"></p>
                </div>
                <button class="button" type="submit">Passwort speichern <span aria-hidden="true">→</span></button>
            </form>
        </section>

        <section class="form-card message-card" th:if="${invalidToken}">
            <span class="account-card-icon account-card-icon--muted" aria-hidden="true">×</span>
            <span class="eyebrow">Link nicht mehr gültig</span>
            <h1>Bitte fordere einen neuen Link an.</h1>
            <p>Dieser Zurücksetzen-Link ist abgelaufen, wurde bereits verwendet oder ist unvollständig.</p>
            <a class="button" th:href="@{/forgot-password}">Neuen Link anfordern <span aria-hidden="true">→</span></a>
        </section>
    </main>
</div>
</body>
</html>
