<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konto erstellt · ZFG</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/navigation :: header}"></header>
    <main class="message-layout">
        <section class="form-card message-card" aria-labelledby="success-title">
            <span class="success-icon" aria-hidden="true">✓</span>
            <span class="eyebrow">Alles bereit</span>
            <h1 id="success-title">Konto erstellt.</h1>
            <p>Deine Registrierung wurde gespeichert. Schön, dass du dabei bist.</p>
            <p class="card-copy">Du kannst dich jetzt mit deiner E-Mail-Adresse und deinem Passwort anmelden.</p>
            <a class="button" th:href="@{/signin}">Anmelden <span aria-hidden="true">↗</span></a>
        </section>
    </main>
    <footer class="site-footer"><span>ZFG</span><span>Gutes beginnt im Kleinen.</span></footer>
</div>
</body>
</html>
