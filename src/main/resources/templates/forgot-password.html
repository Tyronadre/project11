<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passwort vergessen · ZFG</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/navigation :: header}"></header>
    <main class="message-layout">
        <section class="form-card message-card" aria-labelledby="forgot-title">
            <span class="account-card-icon account-card-icon--key" aria-hidden="true">⌁</span>
            <span class="eyebrow">Zurück zu deinem Konto</span>
            <h1 id="forgot-title">Passwort vergessen?</h1>
            <p class="card-copy">Gib deine E-Mail-Adresse ein. Wenn ein Konto dazu existiert, schicken wir dir einen Link zum Zurücksetzen.</p>
            <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post">
                <div class="field">
                    <label for="forgot-email">E-Mail-Adresse</label>
                    <input id="forgot-email" name="email" type="email" autocomplete="email" maxlength="254" required
                           placeholder="alex@example.com" th:value="*{email}"
                           th:attr="aria-invalid=${#fields.hasErrors('email')}">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <button class="button" type="submit">Zurücksetzen-Link anfordern <span aria-hidden="true">→</span></button>
            </form>
            <p class="account-switch"><a th:href="@{/signin}">Doch wieder eingefallen?</a></p>
        </section>
    </main>
    <footer class="site-footer"><span>ZFG</span><span>Wir verraten keine Kontodaten.</span></footer>
</div>
</body>
</html>
