<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{profile/fragments :: head('Zahlungsdaten')}"></head>
<body class="dashboard-body"><div class="page dashboard-page"><header th:replace="~{fragments/navigation :: header}"></header><main class="profile-editor"><a class="event-back" th:href="@{/users/{id}(id=${userId})}">← Zurück zum Profil · Zahlungsdaten verbergen</a><section class="profile-card" th:fragment="details"><h2 th:text="|Zahlungsdaten von ${payments.name}|"></h2><dl><th:block th:if="${!payments.paypal.isEmpty()}"><dt>PayPal</dt><dd class="payment-value" th:text="${payments.paypal}"></dd></th:block><th:block th:if="${!payments.iban.isEmpty()}"><dt>IBAN</dt><dd class="payment-value" th:text="${payments.iban}"></dd></th:block></dl><p th:if="${payments.paypal.isEmpty() and payments.iban.isEmpty()}">Keine Zahlungsdaten hinterlegt.</p></section></main></div></body></html>
